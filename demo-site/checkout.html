<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Sample Store</title>
    <link rel="stylesheet" href="static/store.css">
</head>
<body>
    <header class="header">
        <div class="logo">Sample Store</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/products">Shop</a>
            <a href="/cart" class="cart-nav">Cart (<span id="cart-count">0</span>)</a>
            <a href="/account">Account</a>
        </div>
    </header>
    
    <div class="container">
        <div class="form-container" style="max-width: 600px;">
            <h1 style="margin-bottom: 20px;">Checkout</h1>
            <div class="notice">
                Demo environment — do not enter real payment details.
            </div>
            <form id="checkoutForm" onsubmit="event.preventDefault(); alert('Order placed!');">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Address Line 1</label>
                    <input type="text" name="address_line1" required>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>City</label>
                        <input type="text" name="city" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Postcode</label>
                        <input type="text" name="postcode" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" name="phone" required>
                </div>
                
                <h3 style="margin: 30px 0 15px;">Payment Details</h3>
                <div class="form-group">
                    <label>Card Number</label>
                    <input type="text" name="card_number" required>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Expiry Date</label>
                        <input type="text" name="card_expiry" placeholder="MM/YY" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>CVC</label>
                        <input type="text" name="card_cvc" required>
                    </div>
                </div>
                
                <button type="submit" class="btn">Place Order</button>
            </form>
        </div>
    </div>
    
    <footer class="footer">
        <p>&copy; 2026 Sample Store.</p>
    </footer>
    
    <script src="static/store.js"></script>
    <script src="adamantine-sensor.js" data-key="adm_live_demo" defer></script>
</body>
</html>
