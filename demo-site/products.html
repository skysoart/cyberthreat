<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products - Sample Store</title>
    <link rel="stylesheet" href="static/store.css">
</head>
<body>
    <header class="header">
        <div class="logo">Sample Store</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/products">Shop</a>
            <a href="/cart" class="cart-nav">Cart (<span id="cart-count">0</span>)</a>
            <a href="/account">Account</a>
        </div>
    </header>
    
    <div class="container">
        <h1 style="margin-bottom: 30px;">All Products</h1>
        <div class="product-grid" id="productGrid">
            <!-- Rendered via JS -->
        </div>
        <div class="pagination" id="pagination">
            <!-- Rendered via JS -->
        </div>
    </div>
    
    <footer class="footer">
        <p>&copy; 2026 Sample Store.</p>
    </footer>
    
    <script src="static/products.js"></script>
    <script src="static/store.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const page = parseInt(urlParams.get('page')) || 1;
            
            const grid = document.getElementById('productGrid');
            const items = getProductsPage(page, 12);
            
            items.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img" style="background: ${p.gradient}"></div>
                    <div class="product-title">${p.name}</div>
                    <div class="product-price">$${p.price}</div>
                    <a href="/products/${p.id}" class="btn">View Details</a>
                `;
                grid.appendChild(card);
            });
            
            // Render pagination
            const pag = document.getElementById('pagination');
            const totalPages = Math.ceil(PRODUCTS.length / 12); // exactly 50 pages
            
            if (page > 1) {
                pag.innerHTML += `<a href="/products?page=${page-1}">Prev</a>`;
            }
            
            // Simple pagination (show current, prev, next)
            const startP = Math.max(1, page - 2);
            const endP = Math.min(totalPages, page + 2);
            
            for(let i=startP; i<=endP; i++) {
                pag.innerHTML += `<a href="/products?page=${i}" class="${i===page ? 'active' : ''}">${i}</a>`;
            }
            
            if (page < totalPages) {
                pag.innerHTML += `<a href="/products?page=${page+1}">Next</a>`;
            }
        });
    </script>
    <script src="adamantine-sensor.js" data-key="adm_live_demo" defer></script>
</body>
</html>
