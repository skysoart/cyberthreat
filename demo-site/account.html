<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account - Sample Store</title>
    <link rel="stylesheet" href="static/store.css">
</head>
<body>
    <header class="header">
        <div class="logo">Sample Store</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/products">Shop</a>
            <a href="/cart" class="cart-nav">Cart (<span id="cart-count">0</span>)</a>
            <a href="/account">Account</a>
        </div>
    </header>
    
    <div class="container">
        <h1>Welcome, <span id="userGreeting">User</span>!</h1>
        <p style="color: var(--text-muted); margin-top: 10px;">This is your account dashboard.</p>
        
        <div style="margin-top: 40px; display: flex; gap: 20px;">
            <div class="product-card" style="flex: 1;">
                <h3>Recent Orders</h3>
                <p style="margin-top: 10px; color: var(--text-muted);">You have no recent orders.</p>
            </div>
            <div class="product-card" style="flex: 1;">
                <h3>Account Settings</h3>
                <p style="margin-top: 10px; color: var(--text-muted);">Manage your details here.</p>
            </div>
        </div>
    </div>
    
    <footer class="footer">
        <p>&copy; 2026 Sample Store.</p>
    </footer>
    
    <script src="static/store.js"></script>
    <script src="adamantine-sensor.js" data-key="adm_live_demo" defer></script>
</body>
</html>
