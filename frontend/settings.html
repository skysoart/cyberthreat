<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .settings-container { max-width: 600px; margin: 0 auto; }
        .weight-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; background: var(--bg-dark); padding: 15px; border-radius: 6px; }
        .weight-label { font-size: 14px; font-weight: bold; width: 180px; }
        .weight-slider { flex: 1; margin: 0 20px; }
        .weight-val { font-family: monospace; font-size: 16px; font-weight: bold; width: 50px; text-align: right; color: var(--accent-blue); }
        
        .sum-container { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--bg-panel); border-top: 1px solid var(--border-color); margin-top: 20px; border-radius: 0 0 6px 6px; }
        .sum-val { font-size: 24px; font-weight: bold; font-family: monospace; }
        .sum-valid { color: #10b981; }
        .sum-invalid { color: var(--accent-red); }
        
        .btn-save { background: var(--accent-blue); color: white; border: none; padding: 10px 24px; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-save:disabled { background: var(--bg-hover); color: var(--text-secondary); cursor: not-allowed; }
        
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--border-color);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- layout.js injects sidebar -->
        
        <main class="main-content">
            <header style="margin-bottom: 30px;">
                <h1>Engine Settings</h1>
            </header>
            
            <div id="loadingState"></div>
            
            <div id="settingsContent" style="display:none;" class="settings-container">
                <section class="card" style="padding: 0;">
                    <div style="padding: 20px; border-bottom: 1px solid var(--border-color);">
                        <h3 style="margin-bottom: 10px;">Risk Scoring Weights</h3>
                        <p style="font-size: 13px; color: var(--text-secondary);">Adjust the weights used to calculate the final incident risk score. The total sum must exactly equal 1.00.</p>
                    </div>
                    
                    <div style="padding: 20px;" id="slidersContainer">
                        <!-- Sliders injected by JS -->
                    </div>
                    
                    <div class="sum-container">
                        <div>
                            <div style="font-size: 12px; color: var(--text-secondary); text-transform: uppercase;">Total Sum</div>
                            <div class="sum-val sum-valid" id="totalSum">1.00</div>
                        </div>
                        <button class="btn-save" id="btnSave" onclick="saveWeights()">Save & Rescore</button>
                    </div>
                </section>
                
                <div id="successBanner" style="display:none; background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; padding: 15px; border-radius: 6px; margin-top: 20px; text-align: center; font-weight: bold;">
                    Saved successfully. <span id="rescoredCount"></span> incidents rescored.
                </div>
            </div>
        </main>
    </div>

    <script src="static/api.js"></script>
    <script src="static/layout.js"></script>
    <script src="static/settings.js"></script>
</body>
</html>
